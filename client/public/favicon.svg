      <stop offset="0%" stopColor="#0F766E" />
      <stop offset="50%" stopColor="#0D9488" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>
    <linearGradient id="favGold" x1="20" y1="80" x2="80" y2="20" gradientUnits="userSpaceOnUse">
