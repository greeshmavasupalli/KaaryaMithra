  />

  <!-- Lower Handshake Clasp (Saffron Gold) -->
  <path
    d="M68 76 C58 84, 38 84, 26 75 C18 69, 15 59, 16 50 C17 45, 22 42, 27 44 C32 46, 34 52, 33 57 C32 63, 35 69, 41 72 C47 75, 57 75, 64 70 C69 66, 75 68, 76 73 C77 77, 73 79, 68 76 Z"
