  />

  <!-- Clasping center -->
  <path
    d="M44 48 C41 44, 46 38, 52 42 C57 45, 61 48, 64 45 C67 42, 70 45, 67 49 C64 54, 58 59, 52 56 C47 54, 46 51, 44 48 Z"
